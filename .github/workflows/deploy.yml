name: Deploy client sites

# Deploys every site under sites/<slug>/ that changed in this push to its own
# Cloudflare Pages project (alfea-<slug>). That's it — this workflow no
# longer touches Netlify DNS or custom domains. Every deploy gets a free,
# zero-DNS-footprint preview at https://alfea-<slug>.pages.dev, which is
# what gets sent to a prospect. The branded <slug>.web-creation.alfea.io
# hostname (one Netlify DNS record per site) is only created later, by
# activate-client-domain.yml, once a prospect actually closes — so the
# alfea.io DNS zone only ever grows with paying clients, not every cold
# pitch. Static sites only — no build step.
#
# Why Cloudflare Pages: Netlify's 2026 credit-based free plan (300
# credits/month, ~20 deploys) is shared with julaide.io on the same account
# and can't sustain this project's deploy frequency. Cloudflare Pages' free
# tier (500 builds/month, unlimited bandwidth) can, and is fully separate
# from julaide.io's usage.
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions), set directly in GitHub — never pasted into chat:
#   CLOUDFLARE_API_TOKEN   - scoped to Account.Cloudflare Pages: Edit
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare dashboard -> Workers & Pages overview

on:
  push:
    branches: [main, claude/agency-website-scale-bat25b]
    paths:
      - 'sites/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed sites
        id: changed
        run: |
          if git rev-parse "${{ github.event.before }}" >/dev/null 2>&1 && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- sites | awk -F/ '{print $2}' | sort -u)
          else
            CHANGED=$(find sites -mindepth 1 -maxdepth 1 -type d -printf '%f\n')
          fi
          echo "Changed site slugs:"
          echo "$CHANGED"
          {
            echo "slugs<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy each changed site
        if: steps.changed.outputs.slugs != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler

          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            dir="sites/$slug"
            [ -d "$dir" ] || { echo "skip $slug (removed)"; continue; }
            project="alfea-$slug"

            echo "=== $slug ==="
            wrangler pages project create "$project" --production-branch main 2>/dev/null || true
            wrangler pages deploy "$dir" --project-name "$project" --branch main
            echo "Preview live at: https://$project.pages.dev — send this to the prospect."
            echo "(No custom domain or DNS record created yet. Once this prospect closes, run the 'Activate client domain' workflow with site=$slug.)"
          done <<< "${{ steps.changed.outputs.slugs }}"
