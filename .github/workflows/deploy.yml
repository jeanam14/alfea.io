name: Deploy client sites

# Deploys every site under sites/<slug>/ that changed in this push to its own
# Cloudflare Pages project (alfea-<slug>), adds <slug>.web-creation.alfea.io
# as that project's custom domain, then creates the matching CNAME record in
# Netlify DNS (which stays authoritative for the whole alfea.io zone — this
# workflow never touches Netlify sites, only one DNS record per client).
# Static sites only — no build step.
#
# Why split like this: Netlify's 2026 credit-based free plan (300
# credits/month, ~20 deploys) is shared with julaide.io on the same account
# and can't sustain this project's deploy frequency. Cloudflare Pages' free
# tier (500 builds/month, unlimited bandwidth) can, and is fully separate
# from julaide.io's usage. DNS stays on Netlify untouched.
#
# Requires three repository secrets (Settings -> Secrets and variables ->
# Actions), set directly in GitHub — never pasted into chat:
#   CLOUDFLARE_API_TOKEN   - scoped to Account.Cloudflare Pages: Edit
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare dashboard -> Workers & Pages overview
#   NETLIFY_AUTH_TOKEN     - used ONLY to create one DNS record per client in
#                            the alfea.io zone. Same account-wide caveat as
#                            before: never touches julaide.io's sites.

on:
  push:
    branches: [main]
    paths:
      - 'sites/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed sites
        id: changed
        run: |
          if git rev-parse "${{ github.event.before }}" >/dev/null 2>&1 && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- sites | awk -F/ '{print $2}' | sort -u)
          else
            CHANGED=$(find sites -mindepth 1 -maxdepth 1 -type d -printf '%f\n')
          fi
          echo "Changed site slugs:"
          echo "$CHANGED"
          {
            echo "slugs<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy each changed site
        if: steps.changed.outputs.slugs != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npm install -g wrangler

          # Resolve the Netlify DNS zone id for alfea.io once.
          zone_id=$(curl -s "https://api.netlify.com/api/v1/dns_zones" \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" | \
            node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const z=JSON.parse(d).find(x=>x.name==='alfea.io');console.log(z?z.id:'')})")
          if [ -z "$zone_id" ]; then
            echo "::error::Could not find the alfea.io zone in Netlify DNS — check NETLIFY_AUTH_TOKEN."
            exit 1
          fi

          echo "=== DEBUG: raw Cloudflare API response ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json"
          echo ""
          echo "=== END DEBUG ==="

          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            dir="sites/$slug"
            [ -d "$dir" ] || { echo "skip $slug (removed)"; continue; }
            project="alfea-$slug"
            hostname="$slug.web-creation.alfea.io"
            target="$project.pages.dev"

            echo "=== $slug ==="
            wrangler pages project create "$project" --production-branch main 2>/dev/null || true
            wrangler pages deploy "$dir" --project-name "$project" --branch main

            echo "Adding custom domain $hostname to Cloudflare Pages project $project"
            curl -s -o /dev/null -w "cf custom domain: %{http_code}\n" -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/domains" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$hostname\"}"

            # Create the CNAME in Netlify DNS, only if it doesn't already exist.
            existing=$(curl -s "https://api.netlify.com/api/v1/dns_zones/$zone_id/dns_records" \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" | \
              node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const r=JSON.parse(d).find(x=>x.hostname==='$hostname');console.log(r?r.id:'')})")

            if [ -z "$existing" ]; then
              echo "Creating Netlify DNS CNAME: $hostname -> $target"
              curl -s -o /dev/null -w "netlify dns record: %{http_code}\n" -X POST \
                "https://api.netlify.com/api/v1/dns_zones/$zone_id/dns_records" \
                -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
                -H "Content-Type: application/json" \
                --data "{\"type\":\"CNAME\",\"hostname\":\"$hostname\",\"value\":\"$target\",\"ttl\":3600}"
            else
              echo "DNS record for $hostname already exists, leaving it as-is"
            fi
          done <<< "${{ steps.changed.outputs.slugs }}"
