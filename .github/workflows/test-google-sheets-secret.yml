name: Test Google Sheets service account

# One-off smoke test: confirms the GOOGLE_SHEETS_CREDENTIALS repo secret is
# set, parses as a valid service-account key, and (if given a spreadsheet_id)
# can actually read and write the shared tracker sheet. Delete once the real
# sync workflow exists and has been run successfully.

on:
  workflow_dispatch:
    inputs:
      spreadsheet_id:
        description: 'Optional: the tracker Sheet ID (from its URL, between /d/ and /edit). Leave blank to only validate the credential itself.'
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate credential and (optionally) sheet access
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: |
          pip install --quiet google-auth google-api-python-client
          python3 scripts/test-google-sheets.py "${{ github.event.inputs.spreadsheet_id }}"
