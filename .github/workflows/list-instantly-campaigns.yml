name: List Instantly campaigns

# Read-only lookup of campaigns in the connected Instantly account.
# Output appears in this job's log (no commit needed).
#
# Requires the INSTANTLY_API_KEY repository secret.

on:
  workflow_dispatch:
    inputs:
      starting_after:
        description: 'Pagination cursor (campaign id) to continue from'
        required: false

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List campaigns
        env:
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          STARTING_AFTER: ${{ github.event.inputs.starting_after }}
        run: |
          chmod +x scripts/list-instantly-campaigns.sh
          ./scripts/list-instantly-campaigns.sh
