name: Score prospects (screenshot + vision)

# Takes a sourced batch of businesses (name/website/phone/rating/reviews -
# see prospecting/runs/*.json for the shape) and annotates each with a
# vision-model verdict on whether its website looks outdated. This is a
# ranking/annotation pass, not an accept/reject gate - every business keeps
# its row in the output, verdict included, for Jean's own yes/no review.
#
# Runs here (not in the Claude Code session) because screenshotting
# arbitrary prospect websites needs a real headless browser and unrestricted
# network access, neither of which the sandboxed session has.

on:
  workflow_dispatch:
    inputs:
      batch_file:
        description: 'Path to the batch JSON under prospecting/runs/, e.g. prospecting/runs/2026-10-01-ac-repair-dubai-test.json'
        required: true

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright + Chromium
        run: |
          npm install playwright@latest
          npx playwright install --with-deps chromium

      - name: Score each business
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          out="${{ github.event.inputs.batch_file }}"
          out="${out%.json}-scored.json"
          batch_name=$(basename "${{ github.event.inputs.batch_file }}" .json)
          shots_dir="prospecting/shots/$batch_name"
          bash scripts/prospecting/score-screenshots.sh "${{ github.event.inputs.batch_file }}" "$out" "$shots_dir"
          echo "RESULT_FILE=$out" >> "$GITHUB_ENV"
          echo "SHOTS_DIR=$shots_dir" >> "$GITHUB_ENV"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ env.SHOTS_DIR }}/*-desktop.jpg
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$RESULT_FILE"
          # Only the final screenshots, not the raw fetched HTML/base64/API-body
          # scratch files score-screenshots.sh also drops in this dir.
          git add "$SHOTS_DIR"/*-desktop.jpg 2>/dev/null || true
          git commit -m "Score prospect batch: $(basename "$RESULT_FILE")" || echo "Nothing to commit"
          # Can be dispatched alongside other commit-and-push workflows -
          # retry with a rebase instead of failing outright if another run's
          # commit landed first.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin "${{ github.ref_name }}"
            sleep $((RANDOM % 5 + 1))
          done
          git push
